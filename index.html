<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weekend Trips Pune - Seat Selection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="booking-card">
    <h1>Choose Your Seat</h1>
    <p class="trip-name" id="tripName">Kaas Pathar</p>

    <div class="legend">
      <span><i class="available"></i> Available</span>
      <span><i class="selected"></i> Selected</span>
      <span><i class="booked"></i> Booked</span>
    </div>

    <div class="bus">
      <div class="front">
        <div class="driver">DRIVER</div>
      </div>
      <div id="seatGrid" class="seat-grid"></div>
      <div class="back">BACK</div>
    </div>

    <div class="summary">
      <strong>Selected seat:</strong> <span id="selectedSeat">None</span>
      <button id="continueBtn" disabled>Continue</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
