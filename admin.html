<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekend Trips Pune — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#101828;font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}
.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:22px;box-shadow:0 8px 25px rgba(16,24,40,.06)}
h1{margin:0 0 6px;font-size:28px}.muted{color:#667085}.login{max-width:420px;margin:8vh auto}.field{margin:14px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}button{border:0;border-radius:10px;padding:12px 16px;background:#111827;color:#fff;font-weight:800;cursor:pointer}.danger{background:#b42318}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:16px;background:#fff;border:1px solid #e4e7ec;border-radius:14px}.num{font-size:24px;font-weight:900;margin-top:4px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin:15px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eaecf0;font-size:13px;vertical-align:top}th{background:#f9fafb}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#ecfdf3;color:#027a48;font-weight:800}.error{color:#b42318;margin-top:10px}.hidden{display:none}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body>
<div id="login" class="wrap"><div class="card login"><h1>Weekend Trips Pune</h1><div class="muted">Secure Admin Panel</div>
<div class="field"><label>Username</label><input id="user" value="admin" autocomplete="username"></div>
<div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
<button onclick="login()">Login</button><div id="loginErr" class="error"></div></div></div>
<div id="app" class="wrap hidden"><div class="top"><div><h1>Booking Dashboard</h1><div class="muted">Weekend Trips Pune</div></div><div><button onclick="load()">Refresh</button> <button class="danger" onclick="logout()">Logout</button></div></div>
<div class="stats"><div class="stat">Total bookings<div id="total" class="num">0</div></div><div class="stat">Paid bookings<div id="paid" class="num">0</div></div><div class="stat">Seats booked<div id="seats" class="num">0</div></div><div class="stat">Revenue<div id="revenue" class="num">₹0</div></div></div>
<div class="card"><div class="filters"><select id="trip" onchange="render()"><option value="">All trips</option><option>Kaas Pathar</option><option>Kokan</option><option>Matheran</option><option>Mahabaleshwar</option></select><input id="date" type="date" onchange="render()"><select id="status" onchange="render()"><option value="">All status</option><option value="paid">Paid</option><option value="created">Pending</option></select><button onclick="clearFilters()">Clear</button></div>
<div class="tablewrap"><table><thead><tr><th>Customer</th><th>Mobile</th><th>Trip</th><th>Date</th><th>Pickup</th><th>Seats</th><th>Amount</th><th>Status</th><th>Payment ID</th><th>Created / Paid</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
let all=[];
const $=id=>document.getElementById(id);
async function api(method,body){const r=await fetch('/api/admin-bookings',{method,headers:{'Content-Type':'application/json'},credentials:'include',body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));return {r,d};}
async function login(){const {r,d}=await api('POST',{username:$('user').value.trim(),password:$('pass').value});if(!r.ok){$('loginErr').textContent=d.error||'Login failed';return}showApp();load();}
async function load(){const {r,d}=await api('GET');if(r.status===401){showLogin();return}if(!r.ok){alert(d.error||'Could not load bookings');return}all=d.bookings||[];render();}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
function showLogin(){$('app').classList.add('hidden');$('login').classList.remove('hidden')}
function logout(){document.cookie='wtp_admin=; Max-Age=0; Path=/';showLogin()}
function clearFilters(){$('trip').value='';$('date').value='';$('status').value='';render()}
function render(){const trip=$('trip').value,date=$('date').value,status=$('status').value;const rows=all.filter(x=>(!trip||x.trip===trip)&&(!date||x.date===date)&&(!status||x.status===status));$('total').textContent=rows.length;$('paid').textContent=rows.filter(x=>x.status==='paid').length;$('seats').textContent=rows.reduce((n,x)=>n+(x.seats?.length||0),0);$('revenue').textContent='₹'+rows.filter(x=>x.status==='paid').reduce((n,x)=>n+Number(x.amount||0)/100,0).toLocaleString('en-IN');$('rows').innerHTML=rows.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.phone)+'</td><td>'+esc(x.trip)+'</td><td>'+esc(x.date)+'</td><td>'+esc(x.pickup)+'</td><td>'+esc((x.seats||[]).join(', '))+'</td><td>₹'+(Number(x.amount||0)/100).toLocaleString('en-IN')+'</td><td><span class="pill">'+esc(x.status||'unknown')+'</span></td><td>'+esc(x.paymentId||'—')+'</td><td>'+esc(x.paidAt||x.createdAt||'')+'</td></tr>').join('')||'<tr><td colspan="10">No bookings found.</td></tr>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
